{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <h2>Calorie Tracker</h2>

            <ul>

                <li onclick="openPage('/dashboard/')">
                    Dashboard
                </li>

                <li onclick="openPage('/diet/')">
                    Diet
                </li>

                <li onclick="openPage('/exercise/')">
                    Exercise
                </li>

                <li onclick="openPage('/water/')">
                    Water Intake
                </li>

                <li onclick="goHome()">
                    Logout
                </li>

            </ul>

        </div>

        <!-- MAIN CONTENT -->

        <div class="main-content">

            <h1>Welcome Back 👋</h1>

            <div class="cards">

                <div class="card">

                    <h3>Total Calories</h3>

                    <p id="calories">
                        1200 kcal
                    </p>

                    <button onclick="updateCalories()">
                        Update
                    </button>

                </div>

                <div class="card">

                    <h3>Water Intake</h3>

                    <p id="water">
                        5 Glass
                    </p>

                    <button onclick="updateWater()">
                        Update
                    </button>

                </div>

                <div class="card">

                    <h3>Exercise</h3>

                    <p id="exercise">
                        45 Minutes
                    </p>

                    <button onclick="updateExercise()">
                        Update
                    </button>

                </div>

            </div>

            <div class="summary">

                <h2>Today's Diet</h2>

                <ul>

                    <li>Breakfast - Oats</li>

                    <li>Lunch - Rice & Salad</li>

                    <li>Dinner - Soup</li>

                </ul>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->

    <script>

        function openPage(page){

            window.location.href = page;
        }

        function goHome(){

            alert("Logged Out Successfully!");

            window.location.href = "/";
        }

        function updateCalories(){

            document.getElementById("calories").innerHTML =
            "1500 kcal";

            alert("Calories Updated!");
        }

        function updateWater(){

            document.getElementById("water").innerHTML =
            "8 Glass";

            alert("Water Intake Updated!");
        }

        function updateExercise(){

            document.getElementById("exercise").innerHTML =
            "1 Hour";

            alert("Exercise Updated!");
        }

    </script>

</body>
</html>
